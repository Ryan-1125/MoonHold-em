name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'mobile/**', 'web/**', 'scripts/**', '*.mbt', 'web_bridge/**', 'moon.*', 'package*.json', 'capacitor.config.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'mobile/**', 'web/**', 'scripts/**', '*.mbt', 'web_bridge/**', 'moon.*', 'package*.json', 'capacitor.config.json', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/moon-install.sh
          bash /tmp/moon-install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run android:sync
      - run: npm run test:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:app
      - name: Build test APK and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PokerLab-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
